<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="main-wrapper py-4">
    <div class="container" style="max-width: 750px;">
        <div class="card card-custom p-4 shadow">
            <div class="d-flex align-items-center mb-3">
                <a th:href="@{/bookings}" class="btn btn-sm btn-outline-secondary rounded-circle me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0" th:text="${title}">Tạo đơn đặt phòng mới</h4>
            </div>

            <form th:action="@{/bookings}" th:object="${bookingDto}" method="post">
                <!-- Chọn khách hàng -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold mb-0">Khách hàng <span class="text-danger">*</span></label>
                        <a th:href="@{/customers/new}" target="_blank" class="small text-decoration-none">
                            <i class="bi bi-person-plus me-1"></i>Thêm khách hàng mới
                        </a>
                    </div>
                    <select class="form-select" th:field="*{customerId}" required>
                        <option value="">-- Chọn khách hàng đã có --</option>
                        <option th:each="c : ${customers}" th:value="${c.id}" 
                                th:text="${c.fullName} + ' - ' + ${c.phone} + (${c.idNumber != null} ? ' (CCCD: ' + ${c.idNumber} + ')' : '')"></option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div>
                </div>

                <!-- Chọn ngày -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày nhận phòng (Check-in) <span class="text-danger">*</span></label>
                        <input type="date" id="checkInInput" class="form-control" th:field="*{checkIn}" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('checkIn')}" th:errors="*{checkIn}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày trả phòng (Check-out) <span class="text-danger">*</span></label>
                        <input type="date" id="checkOutInput" class="form-control" th:field="*{checkOut}" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('checkOut')}" th:errors="*{checkOut}"></div>
                    </div>
                </div>

                <!-- Chọn phòng (Chỉ hiện phòng trống theo khoảng ngày) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phòng lưu trú (Chỉ hiển thị phòng còn trống) <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{roomId}" id="roomSelect" required>
                        <option value="">-- Chọn phòng trống --</option>
                        <option th:each="r : ${availableRooms}" th:value="${r.id}" 
                                th:text="'Phòng ' + ${r.roomNumber} + ' - ' + ${r.roomType.name} + ' (' + ${#numbers.formatDecimal(r.roomType.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ/đêm)'"></option>
                    </select>
                    <div class="form-text small" id="roomHelperText">
                        <i class="bi bi-info-circle me-1"></i>Hệ thống tự động lọc các phòng không bị trùng lịch theo ngày đã chọn.
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
                </div>

                <!-- Ghi chú -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Ghi chú / Yêu cầu đặc biệt</label>
                    <textarea class="form-control" th:field="*{note}" rows="2" placeholder="Ví dụ: Khách check-in muộn, yêu cầu tầng cao, phòng yên tĩnh..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/bookings}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-check2 me-1"></i> Đặt phòng ngay
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    // Tự động cập nhật danh sách phòng trống khi thay đổi ngày
    const checkInEl = document.getElementById('checkInInput');
    const checkOutEl = document.getElementById('checkOutInput');
    const roomSelectEl = document.getElementById('roomSelect');
    const helperEl = document.getElementById('roomHelperText');

    function updateAvailableRooms() {
        const cIn = checkInEl.value;
        const cOut = checkOutEl.value;
        if (!cIn || !cOut) return;

        if (cOut <= cIn) {
            helperEl.innerHTML = '<span class="text-danger"><i class="bi bi-exclamation-circle me-1"></i>Ngày trả phòng phải sau ngày nhận phòng.</span>';
            return;
        }

        helperEl.innerHTML = '<span class="text-primary"><i class="bi bi-hourglass-split me-1"></i>Đang kiểm tra phòng trống...</span>';

        fetch(`/rooms/api/available?checkIn=${cIn}&checkOut=${cOut}`)
            .then(res => res.json())
            .then(rooms => {
                roomSelectEl.innerHTML = '<option value="">-- Chọn phòng trống --</option>';
                if (rooms.length === 0) {
                    helperEl.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>Không còn phòng nào trống trong khoảng thời gian này!</span>';
                } else {
                    helperEl.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>Tìm thấy <strong>${rooms.length}</strong> phòng còn trống phù hợp.</span>`;
                    rooms.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.id;
                        opt.textContent = `Phòng ${r.roomNumber} - ${r.roomType.name} (${Number(r.roomType.pricePerNight).toLocaleString('vi-VN')} đ/đêm)`;
                        roomSelectEl.appendChild(opt);
                    });
                }
            })
            .catch(() => {
                helperEl.innerHTML = '<span class="text-danger">Lỗi khi tải danh sách phòng trống.</span>';
            });
    }

    checkInEl.addEventListener('change', updateAvailableRooms);
    checkOutEl.addEventListener('change', updateAvailableRooms);
</script>
</body>
</html>
