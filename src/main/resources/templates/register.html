<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản | Homestay Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .btn-register {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #fff;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-register:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            color: #fff;
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
            <i class="bi bi-person-plus-fill fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Đăng ký thành viên</h3>
        <p class="text-muted small">Tạo tài khoản để trải nghiệm dịch vụ Homestay</p>
    </div>

    <form th:action="@{/register}" th:object="${userDto}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Tên đăng nhập <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{username}" placeholder="Nhập username" required autofocus/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Họ và tên <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn An" required/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Mật khẩu <span class="text-danger">*</span></label>
            <input type="password" class="form-control" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-register w-100 mb-3">
            <i class="bi bi-check-circle me-1"></i> Hoàn tất đăng ký
        </button>

        <div class="text-center">
            <span class="small text-muted">Đã có tài khoản? </span>
            <a th:href="@{/login}" class="small text-primary fw-semibold text-decoration-none">Đăng nhập ngay</a>
        </div>
    </form>
</div>
</body>
</html>
