<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('404 - Không tìm thấy')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="main-wrapper d-flex align-items-center justify-content-center py-5">
    <div class="text-center p-4 card-custom border-0 shadow p-5" style="max-width: 500px;">
        <div class="display-1 fw-bold text-warning mb-3"><i class="bi bi-search"></i> 404</div>
        <h4 class="fw-bold mb-2">Trang không tồn tại</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Tài nguyên hoặc đường dẫn bạn yêu cầu không tồn tại trên hệ thống.'}">Không tìm thấy trang</p>
        <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-house me-1"></i> Trở về Trang chủ
        </a>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
