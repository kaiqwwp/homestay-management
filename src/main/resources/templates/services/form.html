<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="main-wrapper py-4">
    <div class="container" style="max-width: 600px;">
        <div class="card card-custom p-4 shadow">
            <div class="d-flex align-items-center mb-3">
                <a th:href="@{/services}" class="btn btn-sm btn-outline-secondary rounded-circle me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0" th:text="${title}">Thêm / Sửa dịch vụ</h4>
            </div>

            <form th:action="${serviceItemDto.id != null} ? @{/services/{id}(id=${serviceItemDto.id})} : @{/services}" 
                  th:object="${serviceItemDto}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên dịch vụ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Ví dụ: Ăn sáng buffet, Thuê xe máy, Giặt ủi" required/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Đơn vị tính <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{unit}" placeholder="Ví dụ: suất, lần, ngày, chai, giờ" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                        <input type="number" step="1000" min="0" class="form-control" th:field="*{unitPrice}" placeholder="Ví dụ: 50000" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/services}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-check2 me-1"></i> Lưu dịch vụ
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
