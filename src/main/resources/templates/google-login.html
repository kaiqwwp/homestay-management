<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập bằng Google | Homestay Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .google-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 2.2rem;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<div class="google-card">
    <div class="text-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 48 48" class="mb-2">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        <h4 class="fw-bold text-dark mb-1">Đăng nhập bằng Google</h4>
        <p class="text-muted small mb-0">Tiếp tục tới <strong>Homestay Pro</strong></p>
    </div>

    <form th:action="@{/oauth2/google-callback}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Địa chỉ Gmail của bạn <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="vidu@gmail.com" required autofocus/>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Tên hiển thị trên Gmail (Mặc định)</label>
            <input type="text" name="fullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn An (Có thể cập nhật lại sau)"/>
            <div class="form-text small">
                <i class="bi bi-info-circle me-1"></i>Sau khi đăng nhập bằng Gmail lần đầu, bạn sẽ được chuyển đến trang Hồ sơ để bổ sung <strong>CCCD</strong> và <strong>SĐT</strong> trước khi đặt phòng.
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mb-2">
            <i class="bi bi-google me-1"></i> Tiếp tục với tài khoản Gmail này
        </button>
        <a th:href="@{/login}" class="btn btn-light w-100 py-2 rounded-3 small text-secondary">
            Quay lại trang đăng nhập
        </a>
    </form>
</div>
</body>
</html>
