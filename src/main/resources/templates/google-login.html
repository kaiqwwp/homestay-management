<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Tài khoản Google</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }
        .google-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 820px;
            padding: 2.5rem;
        }
        .account-item {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid #e1e3e1;
            transition: background 0.15s ease;
            border-radius: 12px;
        }
        .account-item:hover {
            background: #f1f5f9;
        }
        .account-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0b57d0;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .btn-google-next {
            background: #0b57d0;
            color: #fff;
            border-radius: 999px;
            padding: 0.55rem 1.5rem;
            font-weight: 500;
            border: none;
        }
        .btn-google-next:hover {
            background: #0842a0;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="google-card">
    <div class="row g-4 align-items-start">
        <!-- Cột trái: Logo & Tiêu đề chuẩn Google Sign-In -->
        <div class="col-md-5 pe-md-4">
            <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
            </div>
            <h2 class="fw-normal text-dark mb-2" style="font-size: 2rem;">Chọn một tài khoản</h2>
            <p class="text-secondary mb-0" style="font-size: 1rem;">
                để tiếp tục tới <strong class="text-primary">Homestay Pro</strong>
            </p>
        </div>

        <!-- Cột phải: Danh sách tài khoản Google hoặc nhập tài khoản khác -->
        <div class="col-md-7">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <!-- Danh sách tài khoản có sẵn để bấm 1 chạm đăng nhập ngay -->
            <div id="accountChooserList">
                <div th:each="acc : ${googleAccounts}">
                    <form th:action="@{/oauth2/google-callback}" method="post" class="m-0">
                        <input type="hidden" name="email" th:value="${acc.email}">
                        <input type="hidden" name="fullName" th:value="${acc.fullName}">
                        <button type="submit" class="account-item">
                            <div class="account-avatar" th:text="${acc.fullName != null and !acc.fullName.isEmpty() ? #strings.substring(acc.fullName,0,1) : 'G'}">G</div>
                            <div class="overflow-hidden">
                                <div class="fw-medium text-dark text-truncate" th:text="${acc.fullName}">Võ Nhựt Thanh</div>
                                <div class="small text-secondary text-truncate" th:text="${acc.email}">kodvnt61@gmail.com</div>
                            </div>
                        </button>
                    </form>
                </div>

                <!-- Nút Sử dụng một tài khoản khác -->
                <button type="button" class="account-item border-0 mt-1" onclick="showOtherAccountForm()">
                    <div class="account-avatar bg-light text-dark border">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <div class="fw-medium text-dark">Sử dụng một tài khoản khác</div>
                </button>
            </div>

            <!-- Khung nhập email chuẩn Google (chỉ hiện khi bấm Sử dụng một tài khoản khác) -->
            <div id="otherAccountForm" style="display: none;">
                <form th:action="@{/oauth2/google-callback}" method="post">
                    <div class="form-floating mb-3">
                        <input type="email" name="email" id="googleEmailInput" class="form-control rounded-3" placeholder="Email hoặc số điện thoại" required>
                        <label for="googleEmailInput">Email hoặc Gmail của bạn</label>
                    </div>
                    <div class="small text-secondary mb-4">
                        Để tiếp tục, Google sẽ chia sẻ tên và địa chỉ email của bạn với <strong>Homestay Pro</strong>.
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <button type="button" class="btn btn-link text-decoration-none fw-medium px-0" onclick="hideOtherAccountForm()">
                            Quay lại danh sách
                        </button>
                        <button type="submit" class="btn btn-google-next">
                            Tiếp theo
                        </button>
                    </div>
                </form>
            </div>

            <div class="mt-4 pt-2 border-top d-flex justify-content-between align-items-center small text-secondary">
                <a th:href="@{/login}" class="text-decoration-none text-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại trang đăng nhập Homestay
                </a>
                <span>Tiếng Việt</span>
            </div>
        </div>
    </div>
</div>

<script>
    function showOtherAccountForm() {
        document.getElementById('accountChooserList').style.display = 'none';
        document.getElementById('otherAccountForm').style.display = 'block';
        document.getElementById('googleEmailInput').focus();
    }
    function hideOtherAccountForm() {
        document.getElementById('otherAccountForm').style.display = 'none';
        document.getElementById('accountChooserList').style.display = 'block';
    }
</script>
</body>
</html>
