<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách loại phòng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="main-wrapper py-4">
    <div class="container-fluid px-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-tags text-primary me-2"></i>Quản lý Loại phòng</h3>
                <p class="text-muted small mb-0">Thiết lập cấu hình phòng, sức chứa và đơn giá theo đêm</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/reports/room-types.pdf}" target="_blank" class="btn btn-outline-danger rounded-pill">
                    <i class="bi bi-file-pdf me-1"></i> Xuất PDF
                </a>
                <a th:href="@{/room-types/new}" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-circle me-1"></i> Thêm loại phòng
                </a>
            </div>
        </div>

        <div class="card card-custom p-0 overflow-hidden shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Mã</th>
                            <th>Tên loại phòng</th>
                            <th>Giá mỗi đêm</th>
                            <th>Sức chứa</th>
                            <th>Mô tả tiện ích</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rt : ${roomTypes}">
                            <td class="ps-4 fw-semibold text-muted" th:text="${rt.id}">1</td>
                            <td class="fw-bold text-dark" th:text="${rt.name}">Phòng đơn</td>
                            <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(rt.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ'">300,000 đ</td>
                            <td>
                                <span class="badge bg-secondary bg-opacity-10 text-dark">
                                    <i class="bi bi-people-fill text-muted me-1"></i>
                                    <span th:text="${rt.capacity} + ' người'">2 người</span>
                                </span>
                            </td>
                            <td class="text-muted small" th:text="${rt.description}">Giường đơn view vườn</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/room-types/{id}/edit(id=${rt.id})}" class="btn btn-sm btn-outline-primary rounded-pill me-1">
                                    <i class="bi bi-pencil"></i> Sửa
                                </a>
                                <form th:action="@{/room-types/{id}/delete(id=${rt.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa loại phòng này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roomTypes)}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có loại phòng nào trong hệ thống.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
