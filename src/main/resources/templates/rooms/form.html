<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="main-wrapper py-4">
    <div class="container" style="max-width: 650px;">
        <div class="card card-custom p-4 shadow">
            <div class="d-flex align-items-center mb-3">
                <a th:href="@{/rooms}" class="btn btn-sm btn-outline-secondary rounded-circle me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0" th:text="${title}">Thêm / Sửa thông tin phòng</h4>
            </div>

            <form th:action="${roomDto.id != null} ? @{/rooms/{id}(id=${roomDto.id})} : @{/rooms}" 
                  th:object="${roomDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{imageUrl}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Số phòng <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{roomNumber}" placeholder="Ví dụ: 101, 202, VIP-01" required/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Loại phòng <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{roomTypeId}" required>
                            <option value="">-- Chọn loại phòng --</option>
                            <option th:each="rt : ${roomTypes}" th:value="${rt.id}" 
                                    th:text="${rt.name} + ' (' + ${#numbers.formatDecimal(rt.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ)'"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roomTypeId')}" th:errors="*{roomTypeId}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Trạng thái phòng</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="AVAILABLE">Trống (Sẵn sàng)</option>
                            <option value="OCCUPIED">Đang có khách</option>
                            <option value="MAINTENANCE">Đang bảo trì</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Ảnh đại diện phòng</label>
                    <input type="file" class="form-control" th:field="*{imageFile}" accept="image/*"/>
                    <div class="form-text small">Hỗ trợ các định dạng: JPG, PNG, WEBP. Nếu không tải ảnh, hệ thống sẽ dùng ảnh mặc định.</div>
                    
                    <div th:if="${roomDto.imageUrl != null}" class="mt-3">
                        <span class="small text-muted d-block mb-1">Ảnh hiện tại:</span>
                        <img th:src="${roomDto.imageUrl}" alt="Ảnh phòng hiện tại" style="height: 120px; border-radius: 8px; object-fit: cover;" onerror="this.src='/images/room-default.svg'"/>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/rooms}" class="btn btn-outline-secondary rounded-pill px-4">Hủy</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-check2 me-1"></i> Lưu phòng
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
