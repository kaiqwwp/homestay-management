<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý phòng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="main-wrapper py-4">
    <div class="container-fluid px-4">
        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-door-open text-primary me-2"></i>Danh sách buồng phòng</h3>
                <p class="text-muted small mb-0">Quản lý sơ đồ phòng, tình trạng sẵn sàng và giá niêm yết</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/reports/rooms.pdf}" target="_blank" class="btn btn-outline-danger rounded-pill">
                    <i class="bi bi-file-pdf me-1"></i> Báo cáo danh sách
                </a>
                <a th:href="@{/reports/occupancy.pdf}" target="_blank" class="btn btn-outline-warning text-dark rounded-pill">
                    <i class="bi bi-graph-up me-1"></i> Báo cáo công suất
                </a>
                <a th:href="@{/rooms/new}" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-circle me-1"></i> Thêm phòng mới
                </a>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="card card-custom p-3 mb-4 shadow-sm">
            <form th:action="@{/rooms}" method="get" class="row g-2 align-items-center">
                <div class="col-12 col-md-3">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0" placeholder="Tìm số phòng...">
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <select name="status" class="form-select">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option value="AVAILABLE" th:selected="${status == 'AVAILABLE'}">Trống (Sẵn sàng)</option>
                        <option value="OCCUPIED" th:selected="${status == 'OCCUPIED'}">Đang có khách</option>
                        <option value="MAINTENANCE" th:selected="${status == 'MAINTENANCE'}">Đang bảo trì</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <select name="roomTypeId" class="form-select">
                        <option value="">-- Tất cả loại phòng --</option>
                        <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.name}" th:selected="${roomTypeId == rt.id}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary w-100 rounded-pill">
                        <i class="bi bi-filter me-1"></i> Lọc
                    </button>
                    <a th:href="@{/rooms}" class="btn btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Rooms Grid -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-md-4 col-xl-3" th:each="room : ${roomPage.content}">
                <div class="card card-custom h-100 overflow-hidden shadow-sm d-flex flex-column">
                    <div class="position-relative" style="height: 170px; background: #e2e8f0;">
                        <img th:src="${room.imageUrl != null ? room.imageUrl : '/images/room-default.svg'}"
                             class="w-100 h-100 object-fit-cover" alt="Ảnh phòng"
                             onerror="this.src='/images/room-default.svg'"/>
                        <span class="position-absolute top-0 end-0 m-2 badge rounded-pill px-3 py-1 shadow-sm"
                              th:classappend="${room.status == 'AVAILABLE' ? 'badge-status-available' : (room.status == 'OCCUPIED' ? 'badge-status-occupied' : 'badge-status-maintenance')}"
                              th:text="${room.status == 'AVAILABLE' ? 'Trống' : (room.status == 'OCCUPIED' ? 'Đang ở' : 'Bảo trì')}">
                            Trống
                        </span>
                    </div>
                    <div class="p-3 flex-grow-1 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-baseline mb-1">
                                <h5 class="fw-bold mb-0 text-dark" th:text="'Phòng ' + ${room.roomNumber}">Phòng 101</h5>
                                <span class="fw-bold text-success" th:text="${#numbers.formatDecimal(room.roomType.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ/đêm'">500.000 đ</span>
                            </div>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-tag-fill text-secondary me-1"></i>
                                <span th:text="${room.roomType.name}">Phòng đôi</span>
                                <span class="ms-2"><i class="bi bi-people-fill text-secondary me-1"></i><span th:text="${room.roomType.capacity} + ' người'">2 người</span></span>
                            </p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-2">
                            <a th:href="@{/rooms/{id}/edit(id=${room.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                <i class="bi bi-pencil me-1"></i> Chỉnh sửa
                            </a>
                            <form th:action="@{/rooms/{id}/delete(id=${room.id})}" method="post"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa phòng này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12" th:if="${roomPage.empty}">
                <div class="card card-custom p-5 text-center text-muted">
                    <i class="bi bi-inbox fs-1 mb-2"></i>
                    <p class="mb-0">Không tìm thấy phòng nào phù hợp với điều kiện lọc.</p>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${roomPage.totalPages > 1}" class="d-flex justify-content-center">
            <ul class="pagination">
                <li class="page-item" th:classappend="${roomPage.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/rooms(page=${roomPage.number - 1}, status=${status}, roomTypeId=${roomTypeId}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, roomPage.totalPages - 1)}"
                    th:classappend="${roomPage.number == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/rooms(page=${i}, status=${status}, roomTypeId=${roomTypeId}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${roomPage.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/rooms(page=${roomPage.number + 1}, status=${status}, roomTypeId=${roomTypeId}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
