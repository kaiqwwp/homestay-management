spring.application.name=homestay
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/homestay_db?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SePay Payment Gateway Configuration (VietQR)
sepay.bank.name=MBBank
sepay.bank.account=0123456789
sepay.bank.account-name=HOMESTAY PRO
sepay.api.key=

# Google Gemini AI Configuration
gemini.api.key=

# Email SMTP Default (Disabled by default until configured in application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true